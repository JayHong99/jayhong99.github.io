# Research timeline (rendered by /timeline).
#
# lanes[].columns[]: named columns in the Gantt view (width = relative width, span = sub-columns).
# project.lane / project.column / project.sub: where the box sits (sub defaults to 0).
# start / end: "YYYY-MM" (end omitted = ongoing).   status: done | ongoing
# builds_on: id of the project this one directly continues (gray dashed link).
# phd: true marks projects inside the Ph.D. research bracket (see `phd` below).
# output.type: paper | patent | data     output.role: lead (1st / co-1st) | co
# output.state: published | review | prep (in prep, preprint, ongoing); state_label overrides the status text
# output.date: "YYYY-MM" (omitted = placed at "now"); output.short: label used in the Gantt view

axis:
  start: "2022-04"
  end: "2026-12"
  now: "2026-11"

lanes:
  - key: clinical
    label: "Clinical AI"
    columns:
      - {key: asd, label: "Autism Spectrum Disorder", span: 2}
      - {key: mmd, label: "Moyamoya Disease"}
      - {key: tsc, label: "Tuberous Sclerosis Complex", width: 0.9}
      - {key: sepsis, label: "Sepsis", width: 0.8}
      - {key: crc, label: "Colorectal Cancer", width: 0.9}
  - key: cl
    label: "Continual Learning"
    columns:
      - {key: cl, label: "Hierarchical CL", width: 0.9}
  - key: mm
    label: "Multimodal"
    columns:
      - {key: relate, label: "Encoder merging", width: 0.75}
      - {key: etfuml, label: "Missing modality"}
  - key: fl
    label: "Federated Learning"
    columns:
      - {key: het, label: "FL + Data Heterogeneity"}
      - {key: noise, label: "FL + Label Noise", width: 1.1}
      - {key: km, label: "K-MELLODDY", width: 0.95}
  - key: llm
    label: "LLM"
    columns:
      - {key: he, label: "FL + Homomorphic Encryption", width: 0.92}
      - {key: qpeft, label: "Quantum PEFT", width: 0.75}

phd:
  label: "Ph.D. research"
  members: [etfuml, fedstar, fedformula]
  thesis: "Robust Multimodal Federated Learning under Missing Modality and Label Noise in Healthcare Data"
  defense: "Feb 2027"

threads:
  - key: silo
    label: "Data silo"
    color: "#5F5E5A"
    desc: "Patient data cannot leave each institution — the starting point for federated learning."
    edges:
      - [nia, motie]
  - key: miss
    label: "Missing modality"
    color: "#D85A30"
    desc: "Modalities are missing and asynchronous per patient and per site — addressed by ETF-UML."
    edges:
      - [motie, etfuml]
  - key: het
    label: "Institutional heterogeneity"
    color: "#378ADD"
    desc: "Patient mix, data and diagnostic practice differ across institutions and countries — addressed by FedSTAR."
    edges:
      - [nia, fedstar]
      - [motie, fedstar]
      - [vietnam, fedstar]
  - key: label
    label: "Label unreliability"
    color: "#BA7517"
    desc: "Labels come from human judgment and vary across raters, sites and countries — addressed by FedFORMULA."
    edges:
      - [nia, fedformula]
      - [vietnam, fedformula]

