short_bio: >-
  
  <span style="font-weight:bold; font-size:1.2em;">Research Interests</span>
  <p class="research-interest-list">
    <span class="research-interest-pill">Medical Informatics</span>
    <span class="research-interest-pill">Multimodal AI</span>
    <span class="research-interest-pill">Federated Learning</span>
  </p>
  <p>
    My research aims to build <b>medical AI systems</b> that learn from diverse medical data and address <b>real-world healthcare needs</b>. I focus on <b>multimodal AI</b> to integrate information across clinical modalities, and <b>federated learning</b> to enable collaboration across institutions where high-value medical data cannot be easily shared.
  </p>
  <span style="font-weight:bold; font-size:1.2em;">Biography</span>
  <p>
    I am currently a Ph.D. candidate in the <b>Department of Biomedical Systems Informatics</b> at <b>Yonsei University College of Medicine</b>, supervised by <a href="https://scholar.google.com/citations?user=DNs7sk4AAAAJ&hl=ko&oi=ao" target="_blank">Prof. Yu Rang Park</a>.
    I also work as an AI Researcher at the Digital Healthcare Laboratory <a href="https://www.dhlab.org/" target="_blank">(DHLab)</a> in <b>Yonsei University College of Medicine</b> and <a href="https://yuhs.severance.healthcare/sev-en/index.do" target="_blank">Severance Hospital</a> in Seoul, Republic of Korea.
    Previously, I received my B.B.A. in <a href="https://biz.kookmin.ac.kr" target="_blank">Big Data Management and Statistics</a> from <b>Kookmin University</b> in Seoul, Republic of Korea.
    From July to September in 2021, I worked as a Data Scientist at <a href="https://dacon.io/" target="_blank">DACON</a>, which is the largest data science competition platform in Korea.
  </p>

