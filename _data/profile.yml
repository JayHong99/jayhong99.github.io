short_bio: >-
  
  <span style="font-weight:bold; font-size:1.2em;">Research Interests</span>
  <p>
    <b><u style="text-decoration-color:#00FF00;">Federated Learning</u></b>&emsp;<b><u style="text-decoration-color:#00FF00;">Multimodal AI</u></b>&emsp;<b><u style="text-decoration-color:#00FF00;">Medical Informatics</u></b>.
  </p>
  <p>
    I aim to develop <b>robust, trustworthy, and real-world applicable multimodal AI models</b> by leveraging <b>federated learning</b>, which enables collaborative learning across multiple institutions while preserving data privacy.
  </p>
  <span style="font-weight:bold; font-size:1.2em;">Biography</span>
  <p>
    I am currently a Ph.D candidate in the <b>Department of Biomedical Systems Informatics</b> at <b>Yonsei University College of Medicine</b>, supervised by <a href="https://scholar.google.com/citations?user=DNs7sk4AAAAJ&hl=ko&oi=ao" target="_blank">Prof. Yu Rang Park</a>.
    I also working as an AI Researcher at the Digital Healthcare Laboratory <a href="https://www.dhlab.org/" target="_blank">(DHLab)</a> in <b>Yonsei University College of Medicine</b> and <a href="https://yuhs.severance.healthcare/sev-en/index.do" target="_blank">Severance Hospital</a> in Seoul, Republic of Korea.
    Previously, I finished my B.B.A in <a href="https://biz.kookmin.ac.kr" target="_blank">Big Data Management and Statistics</a> at <b>Kookmin University</b> in Seoul, Republic of Korea.
    From July 2021 to September 2021, I worked as a Data Scientist at <a href="https://dacon.io/" target="_blank">DACON</a>, which is the largest data science competition platform in Korea.
  </p>

